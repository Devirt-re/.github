<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="title desc">
<title id="title">Devirt coverage ledger: proven, runtime-dependent, unresolved, permanently bounded</title>
<desc id="desc">Every Devirt recovery comes with a coverage ledger that gives each function in scope one of four outcomes: proven, runtime-dependent, unresolved or permanently bounded. Illustrative example · no customer data.</desc>
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.code{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:15px;fill:#f2f2f2}
.label{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:11.5px;letter-spacing:1.2px;fill:#9aa3b2}
.scan{animation:scan 10s linear infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}6%,21%{transform:translateY(0);opacity:1}23%,35%{transform:translateY(40px)}37%,49%{transform:translateY(80px)}51%,60%{transform:translateY(120px);opacity:1}66%,100%{transform:translateY(120px);opacity:0}}
@keyframes l0{0%,8%{opacity:0;transform:translateY(4px)}11.0%,92%{opacity:1;transform:none}100%{opacity:0;transform:none}}.l0{animation:l0 10s linear infinite}
@keyframes l1{0%,22%{opacity:0;transform:translateY(4px)}25.0%,92%{opacity:1;transform:none}100%{opacity:0;transform:none}}.l1{animation:l1 10s linear infinite}
@keyframes l2{0%,36%{opacity:0;transform:translateY(4px)}39.0%,92%{opacity:1;transform:none}100%{opacity:0;transform:none}}.l2{animation:l2 10s linear infinite}
@keyframes l3{0%,50%{opacity:0;transform:translateY(4px)}53.0%,92%{opacity:1;transform:none}100%{opacity:0;transform:none}}.l3{animation:l3 10s linear infinite}
.scan,.l0,.l1,.l2,.l3{animation-delay:-6s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="999" height="289" rx="14" fill="#0f0f0f" stroke="#272c36"/>
<text x="36" y="44" class="sans" font-size="20" font-weight="600" fill="#f2f2f2">Coverage ledger</text>
<text x="964" y="44" text-anchor="end" class="sans" font-size="11" fill="#6b7280">Illustrative example · no customer data</text>
<text x="36" y="70" class="sans" font-size="14.5" fill="#9aa3b2">Every function in scope gets one of four outcomes, with the build and assumptions named.</text>
<text x="36" y="108" class="label">FUNCTION</text><text x="270" y="108" class="label">OUTCOME</text><text x="500" y="108" class="label">WHAT IT MEANS</text>
<line x1="36" y1="118" x2="964" y2="118" stroke="#272c36"/>
<rect class="scan" x="28" y="124" width="944" height="34" rx="6" fill="#69b5f5" fill-opacity="0.08"/>
<g class="l0">
<text x="36" y="146" class="code">validate_header()</text>
<rect x="270" y="130" width="86" height="22" rx="11" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80"/>
<text x="313" y="145" text-anchor="middle" class="sans" font-size="11" font-weight="600" letter-spacing="1" fill="#4ade80">PROVEN</text>
<text x="500" y="146" class="sans" font-size="14.5" fill="#f2f2f2">The comparison passed within the stated assumptions</text>
</g>
<g class="l1">
<text x="36" y="186" class="code">load_plugin()</text>
<rect x="270" y="170" width="170" height="22" rx="11" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24"/>
<text x="355" y="185" text-anchor="middle" class="sans" font-size="11" font-weight="600" letter-spacing="1" fill="#fbbf24">RUNTIME-DEPENDENT</text>
<text x="500" y="186" class="sans" font-size="14.5" fill="#f2f2f2">A real input or environment is still needed</text>
</g>
<g class="l2">
<text x="36" y="226" class="code">dispatch_event()</text>
<rect x="270" y="210" width="112" height="22" rx="11" fill="#a1a1aa" fill-opacity="0.14" stroke="#a1a1aa"/>
<text x="326" y="225" text-anchor="middle" class="sans" font-size="11" font-weight="600" letter-spacing="1" fill="#a1a1aa">UNRESOLVED</text>
<text x="500" y="226" class="sans" font-size="14.5" fill="#f2f2f2">The available evidence could not settle it</text>
</g>
<g class="l3">
<text x="36" y="266" class="code">parse_record()</text>
<rect x="270" y="250" width="186" height="22" rx="11" fill="#69b5f5" fill-opacity="0.14" stroke="#69b5f5"/>
<text x="363" y="265" text-anchor="middle" class="sans" font-size="11" font-weight="600" letter-spacing="1" fill="#69b5f5">PERMANENTLY BOUNDED</text>
<text x="500" y="266" class="sans" font-size="14.5" fill="#f2f2f2">A stated limit prevents a stronger conclusion</text>
</g>
</svg>
