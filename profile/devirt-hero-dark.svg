<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 312" width="1000" height="312" role="img" aria-labelledby="title desc">
<title id="title">Devirt: binary devirtualization for authorized analysis</title>
<desc id="desc">Devirt (devirt.re) traces a program protected by a virtual machine, handler by handler, and recovers readable, native-shaped pseudocode that is checked against the original. Illustrative example · no customer data.</desc>
<style>
.code{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:15px}
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.fg{fill:#f2f2f2}.accent{fill:#69b5f5}.num{fill:#f5c26b}.dim{fill:#6b7280}
.label{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:11.5px;letter-spacing:1.2px;fill:#9aa3b2}
.trace{animation:trace 9s steps(1,end) infinite}
@keyframes trace{0%{transform:translateY(0);opacity:0}3%{opacity:1}4%{transform:translateY(0px)}10%{transform:translateY(20px)}16%{transform:translateY(40px)}22%{transform:translateY(60px)}28%{transform:translateY(80px)}33%{transform:translateY(80px);opacity:1}36%,100%{transform:translateY(80px);opacity:0}}
.flow{stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.bar{animation:bar 2.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes bar{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes r0{0%,30%{opacity:0;transform:translateY(4px)}33.0%,90%{opacity:1;transform:none}100%{opacity:0;transform:none}}.r0{animation:r0 9s linear infinite}
@keyframes r1{0%,34%{opacity:0;transform:translateY(4px)}37.0%,90%{opacity:1;transform:none}100%{opacity:0;transform:none}}.r1{animation:r1 9s linear infinite}
@keyframes r2{0%,38%{opacity:0;transform:translateY(4px)}41.0%,90%{opacity:1;transform:none}100%{opacity:0;transform:none}}.r2{animation:r2 9s linear infinite}
@keyframes r3{0%,42%{opacity:0;transform:translateY(4px)}45.0%,90%{opacity:1;transform:none}100%{opacity:0;transform:none}}.r3{animation:r3 9s linear infinite}
@keyframes r4{0%,46%{opacity:0;transform:translateY(4px)}49.0%,90%{opacity:1;transform:none}100%{opacity:0;transform:none}}.r4{animation:r4 9s linear infinite}
@keyframes r5{0%,50%{opacity:0;transform:translateY(4px)}53.0%,90%{opacity:1;transform:none}100%{opacity:0;transform:none}}.r5{animation:r5 9s linear infinite}
@keyframes pill{0%,54%{opacity:0;transform:translateY(4px)}57.0%,90%{opacity:1;transform:none}100%{opacity:0;transform:none}}.pill{animation:pill 9s linear infinite}
.trace,.r0,.r1,.r2,.r3,.r4,.r5,.pill{animation-delay:-5.4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
